name: Tests

on:
  push:
    branches: [master, preview]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README.md supports tmux 3.0+, so keep the compatibility floor in CI.
        tmux-version: ['3.0', '3.1', '3.2', '3.3', '3.4']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats expect libevent-dev ncurses-dev build-essential

      - name: Build tmux ${{ matrix.tmux-version }}
        run: |
          curl -L https://github.com/tmux/tmux/releases/download/${{ matrix.tmux-version }}/tmux-${{ matrix.tmux-version }}.tar.gz | tar xz
          cd tmux-${{ matrix.tmux-version }}
          ./configure
          make -j$(nproc)
          sudo make install
          tmux -V

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests
        run: make test-integration

      - name: Run E2E menu tests
        run: make test-e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      # lib/ is vendored from KakkoiDev/tmux-toolkit via git subtree. Editing it
      # in place here is how five plugins accumulated 26 duplicated helpers in
      # the first place, so a drifted copy fails the build. Fix it upstream and
      # run `make fanout` in the toolkit. Unlike shellcheck above, this one is
      # not `|| true`: a silently drifted library is the failure mode it exists
      # to catch.
      - name: lib/ has not drifted from its tagged source
        run: |
          have=$(find lib -name '*.sh' | sort | xargs shasum | shasum | cut -d' ' -f1)
          want=$(cat lib/.checksum)
          if [ "$have" != "$want" ]; then
            echo "lib/ has drifted from tmux-toolkit $(cat lib/VERSION)" >&2
            echo "  expected $want" >&2
            echo "  actual   $have" >&2
            exit 1
          fi
          echo "lib/ matches tmux-toolkit $(cat lib/VERSION)"

  bash-3-2:
    # macOS still ships /bin/bash 3.2, the minimum documented in README.md.
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install bats-core expect tmux

      - name: Verify compatibility shell
        run: |
          /bin/bash --version
          /bin/bash -c '[[ ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]} == 3.2 ]]'

      - name: Run unit tests with Bash 3.2
        run: make test-unit SHELL=/bin/bash

      - name: Run integration tests with Bash 3.2
        run: make test-integration SHELL=/bin/bash

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats tmux

      - name: Verify tmux version
        run: |
          tmux -V
          # Ensure tmux 3.0+
          version=$(tmux -V | grep -oP '\d+\.\d+' | head -1)
          major=$(echo $version | cut -d. -f1)
          if [ "$major" -lt 3 ]; then
            echo "Error: tmux 3.0+ required"
            exit 1
          fi

      - name: Run smoke tests
        run: make test-smoke

  stress:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats tmux

      - name: Run stress tests
        run: make test-stress
